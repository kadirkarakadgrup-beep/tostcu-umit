<style>

*{box-sizing:border-box}
body{margin:0;font:16px 'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.w{padding:14px 16px}h1{margin:0;font-size:24px;font-weight:800}h3{margin:16px 0 6px}
input,select,button{font:inherit}
input,select{width:100%;padding:12px;margin:4px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:999px}
.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}.on{background:var(--acc);color:#fff;border-color:var(--acc)}
nav{display:flex;gap:8px;padding:0 16px;overflow-x:auto}nav button{white-space:nowrap}

</style></head><body>
<div id="login" class="w"><h1>Yönetim girişi</h1>

<script>
const CFG={apiKey:"AIzaSyBJ6ZkJ5A60wbCIQr4iQBSIZuEP_TwhhDo",authDomain:"tostcu-umit.firebaseapp.com",projectId:"tostcu-umit"};
firebase.initializeApp(CFG);const db=firebase.firestore(),auth=firebase.auth();

let orders=[],menu=[],MAL=[],TAR={},stats=[],P='bugun',D=['',''],view='o',KS=[],ac=null,started=false,first=true,unS=null;
const SEED=[['kavurmali','Kavurmalı Tost','Kavurma, Kaşar','Tostlar',125,250,500,{Ekmek:1,Kavurma:.06,Kaşar:.04,Yağ:.005}],
['karisik','Karışık Tost','Sucuk, Kaşar, Salam','Tostlar',88,175,350,{Ekmek:1,Sucuk:.03,Salam:.03,Kaşar:.04,Yağ:.005}],
['sucuklu-kasarli','Sucuklu Kaşarlı Tost','Sucuk, Kaşar','Tostlar',75,150,300,{Ekmek:1,Sucuk:.05,Kaşar:.04,Yağ:.005}],
['kasarli','Kaşarlı Tost','Kaşar','Tostlar',60,120,240,{Ekmek:1,Kaşar:.06,Yağ:.005}],
['yumurtali','Yumurtalı Tost','Yumurta, Kaşar, Sucuk','Tostlar',100,200,400,{Ekmek:1,Yumurta:2,Kaşar:.03,Sucuk:.03,Yağ:.01}],
['kasap-kofte','Kasap Köfte','Kasap Köfte, Domates, Marul','Köfteler',100,200,400,{Ekmek:1,Köfte:.1,Domates:.03,Marul:.1,Soğan:.02}]];

$('#go').onclick=()=>auth.signInWithEmailAndPassword($('#em').value,$('#pw').value).catch(()=>$('#err').textContent='E-posta veya şifre hatalı.');

function start(){
  db.collection('orders').orderBy('zaman','desc').limit(60).onSnapshot(s=>{
    if(!first&&s.docChanges().some(c=>c.type=='added'&&!c.doc.metadata.hasPendingWrites&&c.doc.data().durum=='Yeni')){announce();navigator.vibrate?.([300,150,300])}
    first=false;orders=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
  db.collection('menu').onSnapshot(s=>{menu=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.sira||0)-(b.sira||0));draw()});
  db.collection('ayar').doc('malzeme').onSnapshot(d=>{MAL=d.exists?d.data().liste||[]:[];draw()});
  db.collection('ayar').doc('tarif').onSnapshot(d=>{TAR=d.exists?d.data():{};draw()});
  db.collection('kasiyer').onSnapshot(s=>{KS=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
  loadS();
  setInterval(()=>{if(orders.some(o=>o.durum=='Yeni'))announce()},15000);
}
function beep(){if(!ac)return;[0,.25].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.4;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.18)})}
function announce(){beep();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Yeni sipariş geldi');u.lang='tr-TR';speechSynthesis.speak(u)}catch(e){}}
$('#en').onclick=async()=>{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();await ac.resume();announce();
  try{await navigator.wakeLock?.request('screen')}catch(e){}
  $('#en').textContent='🔔 Açık';
};
const mp=n=>{const x=MAL.find(a=>lc(a.ad)==lc(n));return x?+x.fiyat:0};
const costItem=(id,boy,adet)=>Object.entries(TAR[id]||{}).reduce((s,[n,q])=>s+q*mp(n),0)*(FZ[boy]??1)*adet;
const nm=i=>esc(i.ad)+(i.boy&&i.boy!='Adet'?' ('+i.boy+')':'')+(i.ikram?' 🎁':'');
function draw(){
  const y=orders.filter(o=>o.durum=='Yeni').length;document.title=(y?'('+y+') ':'')+'Tostcu Ümit · Yönetim';
  ({o:drawO,f:drawF,g:drawG,s:drawS,y:drawY})[view]();
}
function drawO(){
  $('#o').innerHTML=orders.map(o=>{
    const t=o.zaman?.toDate?.().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})||'',n=NEXT[o.durum];
    return `<div class="o ${esc(o.durum)}"><div class="top"><b>#${o.id.slice(-5).toUpperCase()} · ${t}</b><span class="st">${esc(o.durum)}</span></div>
    <div>${esc(o.ad)}${o.tel?` · <a href="tel:${esc(o.tel)}">${esc(o.tel)}</a>`:''}</div><div class="mut">${esc(o.adres)}</div>
    <div style="margin-top:6px">${(o.items||[]).map(i=>`${i.adet}× ${nm(i)}`).join('<br>')}</div>
    ${o.not?`<div class="mut">Not: ${esc(o.not)}</div>`:''}
    <div class="top" style="margin-top:6px"><b>${TL(o.toplam||0)}</b><span class="mut">${o.kaynak=='Dükkan'?'Şube':'QR'} · ${esc(o.odeme)}</span></div>
    ${n?`<div class="acts"><button class="p" data-st="${o.id}|${n}">${n==='Hazırlanıyor'?'Siparişi kabul et':n==='Yolda'?'Yola çıktı':'Teslim edildi'}</button><button data-st="${o.id}|İptal">İptal</button></div>`:o.durum=='Teslim edildi'?`<div class="acts"><button data-st="${o.id}|İade">İade</button></div>`:''}</div>`}).join('')||'<p class="mut">Henüz sipariş yok.</p>';
}
function range(){
  const t=new Date();t.setHours(0,0,0,0);const T=t.getTime(),DY=864e5;
  if(P=='bugun')return[t,new Date(T+DY)];if(P=='dun')return[new Date(T-DY),t];
  if(P=='hafta')return[new Date(T-((t.getDay()+6)%7)*DY),new Date(T+DY)];
  if(P=='ay')return[new Date(t.getFullYear(),t.getMonth(),1),new Date(T+DY)];
  return[new Date(D[0]+'T00:00'),new Date(new Date(D[1]+'T00:00').getTime()+DY)];
}
function loadS(){
  const r=range();if(isNaN(r[0])||isNaN(r[1]))return;
  if(P!='ozel'){D=[ymd(r[0]),ymd(new Date(r[1]-864e5))];$('#d1').value=D[0];$('#d2').value=D[1]}
  unS&&unS();unS=db.collection('orders').where('zaman','>=',r[0]).where('zaman','<',r[1]).onSnapshot(s=>{stats=s.docs.map(x=>x.data());if(view=='s')drawS()});
}
$('#d1').onchange=$('#d2').onchange=()=>{P='ozel';D=[$('#d1').value,$('#d2').value];loadS()};
function drawS(){
  document.querySelectorAll('[data-pr]').forEach(b=>b.classList.toggle('on',b.dataset.pr==P));
  const A=stats.filter(o=>o.durum!='İptal'&&o.durum!='İade'),X=stats.filter(o=>o.durum=='İptal'),R=stats.filter(o=>o.durum=='İade'),sum=(a,f)=>a.reduce((t,o)=>t+f(o),0);
  const ciro=sum(A,o=>o.toplam||0),n=A.length,its=A.flatMap(o=>o.items||[]);
  const mal=sum(its,i=>costItem(i.id,i.boy,i.adet)),kar=ciro-mal;
  const IK=its.filter(i=>i.ikram),ikN=sum(IK,i=>i.adet),ikV=sum(IK,i=>(i.deger||0)*i.adet),ikC=sum(IK,i=>costItem(i.id,i.boy,i.adet));
  const sube=sum(A.filter(o=>o.kaynak=='Dükkan'),o=>o.toplam||0),U={};
  its.filter(i=>!i.ikram).forEach(i=>{const k=i.ad+(i.boy&&i.boy!='Adet'?' ('+i.boy+')':'');U[k]=U[k]||[0,0];U[k][0]+=i.adet;U[k][1]+=i.fiyat*i.adet});
  const c=(a,b)=>`<div class="m"><div class="mut">${a}</div><div style="font-size:21px;font-weight:700">${b}</div></div>`;
  const li=a=>a.map(([k,v])=>`<div class="top"><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<span class="mut">Kayıt yok</span>';
  $('#sc').innerHTML=`<div class="hero" style="margin-top:8px"><div>Ciro</div><div class="big">${TL(ciro)}</div></div>
  <div class="gc" style="margin-top:8px">${c('Sipariş',n)}${c('Ortalama sipariş',n?TL(ciro/n):'-')}${c('Maliyet',TL(mal))}${c('Net kâr',TL(kar)+' · %'+(ciro?Math.round(kar/ciro*100):0))}${c('İkram',ikN+' adet · '+TL(ikV))}${c('İptal',X.length+' · '+TL(sum(X,o=>o.toplam||0)))}${c('İade',R.length+' · '+TL(sum(R,o=>o.toplam||0)))}${c('Şube satışı',TL(sube))}${c('QR sipariş',TL(ciro-sube))}</div>
  <h3>Ürün bazında</h3><div class="m">${li(Object.entries(U).sort((a,b)=>b[1][0]-a[1][0]).map(([k,v])=>[k,v[0]+' adet · '+TL(v[1])]))}</div>
  <h3>🎁 İkram edilenler (${TL(ikV)}, maliyeti ${TL(ikC)})</h3><div class="m">${li(IK.map(i=>[i.ad+' ('+i.boy+')',i.adet+' adet']))}</div>`;
}
function drawY(){
  const T=(k,l,v,a,b)=>`<button class="${v?'p':''}" data-yt="${k}">${l}: ${v?a:b}</button>`;
  $('#y').innerHTML=`<div class="m"><b>Yeni kasiyer</b><input id="yu" placeholder="Kullanıcı adı (harf ve rakam)" autocapitalize="none"><input id="yp" placeholder="Şifre (en az 6 karakter)"><button class="p" data-ya style="width:100%;margin-top:6px">Kasiyer ekle</button><p class="mut">Kasiyer, kasa.html sayfasından kullanıcı adı ve şifreyle girer.</p></div>`+
  KS.map(k=>`<div class="m"><div class="top"><b>${esc(k.kullanici)}</b>${T(k.id+'|aktif','Hesap',k.aktif!==false,'aktif','pasif')}</div><div class="mut" style="margin-top:6px">Yetkiler</div><div class="acts">${T(k.id+'|iptal','İptal',k.iptal,'var','yok')}${T(k.id+'|iade','İade',k.iade,'var','yok')}${T(k.id+'|ikram','İkram',k.ikram,'var','yok')}</div></div>`).join('');
}
function drawF(){
  const inp=(m,f,ph,v)=>`<input data-f="${f}" placeholder="${ph}" value="${esc(v??'')}"${['c','y','t'].includes(f)?' inputmode="decimal"':''}>`;
  $('#f').innerHTML=`<button class="p" data-seed style="width:100%">⬇️ Hazır menüyü yükle (6 ürün, malzeme, tarif)</button>`+
  [...menu,{id:'new',ad:'',aciklama:'',kategori:'Tostlar',p:{}}].map(m=>`<div class="m" data-id="${m.id}"><b>${m.id=='new'?'Yeni ürün':esc(m.ad)}</b>
  ${inp(m,'ad','Ürün adı',m.ad)}${inp(m,'kategori','Kategori',m.kategori)}${inp(m,'aciklama','İçindekiler',m.aciklama)}
  <div class="acts">${inp(m,'c','Çeyrek ₺',m.p?.c)}${inp(m,'y','Yarım ₺',m.p?.y)}${inp(m,'t','Tam ₺',m.p?.t)}</div>${inp(m,'foto','Fotoğraf linki (isteğe bağlı)',m.foto)}
  <div class="acts"><button class="p" data-fs="${m.id}">Kaydet</button>${m.id!='new'?`<button data-fv="${m.id}">${m.aktif===false?'Satışa aç':'Bugün yok'}</button><button data-fd="${m.id}">Sil</button>`:''}</div></div>`).join('');
}
function drawG(){
  $('#g').innerHTML=`<div class="m"><b>Malzemeler (birim fiyatı)</b>${MAL.map((a,i)=>`<div class="acts" data-mr><input data-n value="${esc(a.ad)}"><select data-u>${['adet','kg','lt'].map(u=>`<option${u==a.birim?' selected':''}>${u}</option>`).join('')}</select><input data-p inputmode="decimal" value="${a.fiyat}"><button data-gd="${i}">🗑</button></div>`).join('')}
  <div class="acts"><input id="gn" placeholder="Yeni malzeme"><select id="gu"><option>adet</option><option>kg</option><option>lt</option></select><input id="gp" inputmode="decimal" placeholder="₺"><button class="p" data-ga>+</button></div>
  <button class="p" data-gs style="width:100%;margin-top:8px">Malzemeleri kaydet</button><p class="mut">Fiyat: adet için 1 adedin, kg ve lt için 1 kg / 1 lt fiyatı.</p></div>
  <div class="m"><b>Tarifler (1 yarım porsiyonda ne kadar?)</b><p class="mut">Örnek: Ekmek=1, Kaşar=0.04, Yağ=0.005 (kg ve lt cinsinden). Hazır tarifler tahmini başlangıç değerleridir, kendi gramajınla değiştir. Çeyrek yarımın yarısı, tam iki katı sayılır.</p>
  ${menu.map(m=>`<div data-tid="${m.id}" style="margin:10px 0"><b>${esc(m.ad)}</b> <span class="mut">≈ ${TL(costItem(m.id,'Yarım',1))} maliyet / yarım</span><input data-tx value="${esc(Object.entries(TAR[m.id]||{}).map(([k,v])=>k+'='+v).join(', '))}"></div>`).join('')}
  <button class="p" data-ts style="width:100%">Tarifleri kaydet</button></div>`;
}
const saveM=l=>db.collection('ayar').doc('malzeme').set({liste:l});
document.addEventListener('click',e=>go(e).catch(x=>alert('İşlem yapılamadı: '+(x.code=='permission-denied'?'izin yok. Firestore kurallarını (ayar, kasiyer) güncelledin mi?':x.message))));
async function go(e){
  const t=e.target.closest('[data-t],[data-st],[data-pr],[data-fs],[data-fv],[data-fd],[data-seed],[data-gd],[data-ga],[data-gs],[data-ts],[data-ya],[data-yt]');if(!t)return;const d=t.dataset;
  if('t'in d){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===t));view=d.t;['s','o','f','g','y'].forEach(i=>$('#'+i).hidden=i!=view);draw()}
  else if('st'in d){const[id,st]=d.st.split('|');if((st=='İptal'||st=='İade')&&!confirm('Sipariş '+st.toLowerCase()+' edilsin mi?'))return;
    const o=orders.find(x=>x.id==id),n=o&&(o.telN||norm(o.tel||'')),tr=n&&db.collection('takip').doc(n).collection('s').doc(id),b=db.batch();
    b.update(db.collection('orders').doc(id),{durum:st});
    if(tr){if(st=='Teslim edildi'||st=='İptal'||st=='İade')b.delete(tr);else b.set(tr,{durum:st},{merge:true})}
    await b.commit()}
  else if('pr'in d){P=d.pr;loadS();drawS()}
  else if('fs'in d){const bx=document.querySelector('[data-id="'+d.fs+'"]'),g=f=>bx.querySelector('[data-f="'+f+'"]').value.trim();
    if(!g('ad')){alert('Ürün adı gerekli.');return}
    const p={c:num(g('c')),y:num(g('y')),t:num(g('t'))},v={ad:g('ad'),kategori:g('kategori')||'Diğer',aciklama:g('aciklama'),foto:g('foto'),p,fiyat:p.y||p.t||p.c};
    if(d.fs=='new')await db.collection('menu').add({...v,aktif:true,sira:Date.now()});else await db.collection('menu').doc(d.fs).set(v,{merge:true})}
  else if('fv'in d){const m=menu.find(x=>x.id==d.fv);db.collection('menu').doc(d.fv).update({aktif:m.aktif===false})}
  else if('fd'in d){if(confirm('Ürün silinsin mi?'))db.collection('menu').doc(d.fd).delete()}
  else if('seed'in d){if(!confirm('Hazır menü yüklenecek. Menüde aynı adlı ürün varsa fiyatına dokunulmaz, sadece tarif bağlanır. Malzeme listesi ve tarifler hazır değerlerle değişir. Devam?'))return;
    const b=db.batch(),tar={};
    SEED.forEach(([id,ad,aciklama,kategori,c,y,t,tr],i)=>{const al=AL[id]||[],ex=menu.find(m=>al.includes(lc(m.ad)));
      if(ex)tar[ex.id]=tr;else{b.set(db.collection('menu').doc(id),{ad,aciklama,kategori,p:{c,y,t},fiyat:y,aktif:true,sira:i+1});tar[id]=tr}});
    b.set(db.collection('ayar').doc('malzeme'),{liste:SMAL.map(([ad,birim,fiyat])=>({ad,birim,fiyat}))});b.set(db.collection('ayar').doc('tarif'),tar);await b.commit();alert('Hazır menü yüklendi.')}
  else if('ya'in d){const u=$('#yu').value.toLowerCase().replace(/[^a-z0-9]/g,''),pw=$('#yp').value;if(!u||pw.length<6){alert('Kullanıcı adı (harf ve rakam) ve en az 6 karakterli şifre gerekli.');return}
    const a2=firebase.apps.find(a=>a.name=='sec')||firebase.initializeApp(CFG,'sec'),cr=await a2.auth().createUserWithEmailAndPassword(u+'@kasa.tostcu',pw);
    await db.collection('kasiyer').doc(cr.user.uid).set({kullanici:u,aktif:true,iptal:false,iade:false,ikram:false});await a2.auth().signOut();alert('Kasiyer eklendi: '+u)}
  else if('yt'in d){const[id,f]=d.yt.split('|'),k=KS.find(x=>x.id==id);await db.collection('kasiyer').doc(id).update({[f]:f=='aktif'?k.aktif===false:!k[f]})}
  else if('gd'in d){await saveM(MAL.filter((_,i)=>i!=d.gd))}
  else if('ga'in d){const ad=$('#gn').value.trim();if(!ad)return;await saveM([...MAL,{ad,birim:$('#gu').value,fiyat:num($('#gp').value)}])}
  else if('gs'in d){await saveM([...document.querySelectorAll('[data-mr]')].map(r=>({ad:r.querySelector('[data-n]').value.trim(),birim:r.querySelector('[data-u]').value,fiyat:num(r.querySelector('[data-p]').value)})).filter(a=>a.ad));t.textContent='Kaydedildi ✓'}
  else if('ts'in d){const out={},bad=[];
    document.querySelectorAll('[data-tid]').forEach(r=>{const mp2={};r.querySelector('[data-tx]').value.split(',').forEach(p=>{const[a,b]=p.split('=');if(a&&a.trim()){const n=a.trim();mp2[n]=num(b);if(!MAL.some(x=>lc(x.ad)==lc(n)))bad.push(n)}});out[r.dataset.tid]=mp2});
    await db.collection('ayar').doc('tarif').set(out);t.textContent='Kaydedildi ✓';if(bad.length)alert('Malzeme listesinde olmayan adlar (maliyeti 0 sayılır): '+[...new Set(bad)].join(', '))}
}
</script></body></html>
