<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tostcu Ümit Kara</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6dac9;--card:#f4ede2;--ink:#3b2616;--mut:#7d6a58;--acc:#c79a3b;--line:#cdbda8;--red:#b3342a}
@media(prefers-color-scheme:dark){:root{--bg:#1f1710;--card:#2c2218;--ink:#f1e6d4;--mut:#b5a48e;--acc:#d4a84a;--line:#44372a;--red:#e8786c}}
*{box-sizing:border-box}
body{margin:0;font:16px 'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:96px}
.tp{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.pill{border:0;background:var(--card);color:var(--ink);border-radius:24px;padding:12px 18px;font:inherit;font-weight:600}
.ic{display:flex;gap:10px}.ic a{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;font-size:20px}
header{display:flex;align-items:center;gap:14px;padding:14px 16px 10px}
.logo{width:96px;height:96px;border-radius:50%;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.28)}
header small{display:block;font-size:12px;letter-spacing:.22em;color:var(--mut)}
h1{margin:2px 0;font:700 34px/1.05 'Dancing Script',cursive}header p{margin:2px 0 0;color:var(--mut)}
.cat{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,var(--card),var(--bg));border-radius:20px;padding:20px 22px;margin:16px 16px 6px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.cat h2{margin:0;font-size:28px}.cat p{margin:4px 0 0;color:var(--mut);max-width:190px}.cat>span{font-size:64px;line-height:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:calc(100% - 32px);margin:8px 16px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;color:var(--ink);font:inherit}
.item b{display:block;font-size:19px}.item small{color:var(--mut);font-size:15px}.chev{color:var(--acc);font-size:30px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);display:none}
.btn{width:100%;border:0;background:var(--acc);color:#2b1c10;padding:15px;border-radius:14px;font:600 17px inherit;font-family:inherit;margin-top:8px}
.ghost{background:none;color:var(--mut)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end}
#sheet.show{display:flex}
#sh{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#sh h2{margin:0 0 4px}.mut{color:var(--mut)}
input,textarea{width:100%;padding:13px;margin:5px 0;border-radius:10px;border:1px solid var(--line);font:inherit;background:var(--card);color:var(--ink)}
.sz{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);gap:8px}
.sz b{display:block}.f{color:var(--red);font-weight:600}
.q{display:flex;align-items:center;gap:12px}.q button{width:44px;height:44px;border-radius:12px;border:0;background:var(--line);color:var(--ink);font-size:22px}.q .pl{background:var(--acc);color:#2b1c10}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.ok{text-align:center;padding:24px 0}.ok h2{font-size:26px}
.tr{background:var(--card);border-radius:12px;padding:12px;margin:8px 0}
</style></head><body>
<div class="tp"><button class="pill" data-tk>🔎 Siparişim</button><span class="ic"><a href="tel:05330290392" aria-label="Ara">📞</a><a href="https://wa.me/905330290392" target="_blank" rel="noopener" aria-label="WhatsApp ile mesaj yaz">💬</a></span></div>
<header><img class="logo" src="__LOGO__" alt="Tostcu Ümit Kara"><div><small>LEZZETİN ADRESİ</small><h1>Tostcu Ümit Kara</h1><p>Sıcak lezzet · Taptaze</p></div></header>
<div id="grid"><p style="padding:16px">Menü yükleniyor…</p></div>
<div id="bar"><button class="btn" data-o>Sepeti gör</button></div>
<div id="sheet"><div id="sh"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CFG={apiKey:"AIzaSyBJ6ZkJ5A60wbCIQr4iQBSIZuEP_TwhhDo",authDomain:"tostcu-umit.firebaseapp.com",projectId:"tostcu-umit"};
firebase.initializeApp(CFG);const db=firebase.firestore();
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TL=n=>Number(n).toLocaleString('tr-TR',{maximumFractionDigits:2})+' ₺';
const norm=t=>{t=String(t).replace(/\D/g,'');if(t.startsWith('90')&&t.length==12)t=t.slice(2);if(t.startsWith('0'))t=t.slice(1);return t};
const BOY=[['c','Çeyrek'],['y','Yarım'],['t','Tam']];
const KAT={Tostlar:['Sıcak, bol malzemeli taptaze tostlar','🥪'],Köfteler:['Izgara, sıcak, doyurucu köfte ekmek','🍔']};
let menu=[],cart={},open=0,cur=null,unT=null;
const sizes=m=>m.p?BOY.filter(([k])=>m.p[k]>0).map(([k,l])=>({l,f:+m.p[k]})):[{l:'Adet',f:+m.fiyat}];
const look=k=>{const[id,l]=k.split('|'),m=menu.find(x=>x.id==id),s=m&&sizes(m).find(z=>z.l==l);return s?{m,l,f:s.f}:null};
const total=()=>Object.entries(cart).reduce((t,[k,q])=>{const x=look(k);return t+(x?x.f*q:0)},0);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const lbl=(m,l)=>m.ad+(l=='Adet'?'':' ('+l+')');
db.collection('menu').onSnapshot(s=>{
  menu=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.aktif!==false).sort((a,b)=>(a.sira||0)-(b.sira||0));render()},
  ()=>{$('#grid').innerHTML='<p style="padding:16px">Menü açılamadı. Bağlantını kontrol et.</p>'});
function render(){
  const cats=[...new Set(menu.map(m=>m.kategori||'Diğer'))];
  $('#grid').innerHTML=cats.map(c=>{const k=KAT[c]||['','🍽️'];
    return `<div class="cat"><div><h2>${esc(c)}</h2><p>${esc(k[0])}</p></div><span>${k[1]}</span></div>`+
    menu.filter(m=>(m.kategori||'Diğer')==c).map(m=>`<button class="item" data-i="${m.id}"><span><b>${esc(m.ad)}</b><small>${esc(m.aciklama)}</small></span><span class="chev">›</span></button>`).join('')}).join('')||'<p style="padding:16px">Menü yakında burada.</p>';
  const n=count();$('#bar').style.display=n?'block':'none';$('#bar button').textContent=`Sepeti gör (${n}) · ${TL(total())}`;
  if(open==1)pick(cur);else if(open==2)sheet();
}
function pick(id){
  cur=id;const m=menu.find(x=>x.id==id);if(!m)return;
  $('#sh').innerHTML=`<h2>${esc(m.ad)}</h2><span class="mut">${esc(m.aciklama)}</span>`+sizes(m).map(s=>{const k=id+'|'+s.l;
    return `<div class="sz"><span><b>${s.l}</b><span class="f">${TL(s.f)}</span></span><span class="q"><button data-m="${k}">−</button>${cart[k]||0}<button class="pl" data-a="${k}">+</button></span></div>`}).join('')+
    `<button class="btn" data-x>Tamam</button>`;
  $('#sheet').classList.add('show');open=1;
}
function sheet(){
  const v=['ad','tel','adr','not'].map(i=>$('#'+i)?.value||'');
  const rows=Object.entries(cart).map(([k,q])=>{const x=look(k);return x?`<div class="row"><span>${esc(lbl(x.m,x.l))}</span><span class="q"><button data-m="${k}">−</button>${q}<button class="pl" data-a="${k}">+</button></span><b>${TL(x.f*q)}</b></div>`:''}).join('');
  $('#sh').innerHTML=`<h2>Sepetin</h2>${rows}<div class="row"><b>Toplam</b><b>${TL(total())}</b></div>
  <input id="ad" placeholder="Adın soyadın" autocomplete="name"><input id="tel" type="tel" placeholder="Telefon numaran" autocomplete="tel">
  <textarea id="adr" rows="2" placeholder="Açık adres (mahalle, sokak, kapı no)"></textarea><input id="not" placeholder="Siparişe not (isteğe bağlı)">
  <p class="mut" style="margin:6px 0">Ödeme kapıda: nakit veya kart.</p>
  <button class="btn" data-s>Siparişi ver</button><button class="btn ghost" data-x>Menüye dön</button>`;
  ['ad','tel','adr','not'].forEach((i,k)=>$('#'+i).value=v[k]);
  $('#sheet').classList.add('show');open=2;
}
function close(){$('#sheet').classList.remove('show');open=0;unT&&unT();unT=null}
async function send(){
  const o={ad:$('#ad').value.trim(),tel:$('#tel').value.trim(),adres:$('#adr').value.trim(),not:$('#not').value.trim()};
  if(!o.ad||!o.tel||!o.adres){alert('Ad, telefon ve adres gerekli.');return}
  if(norm(o.tel).length<10){alert('Geçerli bir telefon numarası gir.');return}
  const b=$('[data-s]');b.disabled=true;b.textContent='Gönderiliyor…';
  const items=Object.entries(cart).map(([k,q])=>{const x=look(k);return x&&{id:x.m.id,ad:x.m.ad,boy:x.l,fiyat:x.f,adet:q}}).filter(Boolean);
  try{
    const tn=norm(o.tel),r=db.collection('orders').doc(),z=firebase.firestore.FieldValue.serverTimestamp(),toplam=total(),bt=db.batch();
    bt.set(r,{...o,telN:tn,items,toplam,durum:'Yeni',odeme:'Kapıda',kaynak:'Online',zaman:z});
    bt.set(db.collection('takip').doc(tn).collection('s').doc(r.id),{items,toplam,durum:'Yeni',zaman:z});await bt.commit();
    try{localStorage.setItem('tel',tn)}catch(e){}
    cart={};open=0;$('#bar').style.display='none';
    $('#sh').innerHTML=`<div class="ok"><h2>Siparişin alındı</h2><p>Sipariş no: <b>${r.id.slice(-5).toUpperCase()}</b></p><p>Hazırlanınca seni arayacağız.</p><button class="btn" data-tk>Siparişimi takip et</button><button class="btn ghost" data-x>Kapat</button></div>`;
  }catch(e){b.disabled=false;b.textContent='Siparişi ver';alert('Sipariş gönderilemedi. Tekrar dene.')}
}
function trackUI(){
  let sv='';try{sv=localStorage.getItem('tel')||''}catch(e){}
  $('#sh').innerHTML=`<h2>Siparişim</h2><input id="tt" type="tel" placeholder="Sipariş verdiğin telefon numarası" value="${esc(sv)}"><button class="btn" data-tg>Siparişimi göster</button><div id="tl" style="margin:10px 0"></div><button class="btn ghost" data-x>Kapat</button>`;
  $('#sheet').classList.add('show');open=0;if(sv)watch(sv);
}
function watch(t){
  const n=norm(t);unT&&unT();unT=null;
  if(n.length<10){$('#tl').innerHTML='<p>Geçerli bir telefon numarası gir.</p>';return}
  const L={Yeni:'Siparişin alındı',Hazırlanıyor:'Hazırlanıyor',Yolda:'Yolda'};
  unT=db.collection('takip').doc(n).collection('s').onSnapshot(s=>{
    $('#tl').innerHTML=s.docs.map(d=>d.data()).sort((a,b)=>(b.zaman?.seconds||0)-(a.zaman?.seconds||0)).map(o=>`<div class="tr"><b>${esc(L[o.durum]||o.durum)}</b><div>${(o.items||[]).map(i=>i.adet+'× '+esc(i.ad)+(i.boy&&i.boy!='Adet'?' ('+i.boy+')':'')).join(', ')}</div><div>${TL(o.toplam||0)}</div></div>`).join('')||'<p>Aktif siparişin yok. Teslim edilen siparişler burada görünmez.</p>';
  },()=>{$('#tl').innerHTML='<p>Sipariş bilgisi alınamadı.</p>'});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-i],[data-a],[data-m],[data-o],[data-x],[data-s],[data-tk],[data-tg]');if(!t)return;
  const d=t.dataset;
  if('i'in d)pick(d.i);
  else if('a'in d){cart[d.a]=(cart[d.a]||0)+1;render()}
  else if('m'in d){cart[d.m]=(cart[d.m]||0)-1;if(cart[d.m]<=0)delete cart[d.m];if(!count()&&open==2)close();render()}
  else if('o'in d)sheet();
  else if('x'in d){close();render()}
  else if('tk'in d)trackUI();
  else if('tg'in d)watch($('#tt').value);
  else if('s'in d)send();
});
</script></body></html>
