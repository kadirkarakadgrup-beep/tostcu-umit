<style>
:root{--bg:#e6dac9;--card:#f4ede2;--ink:#3b2616;--mut:#7d6a58;--acc:#c79a3b;--line:#cdbda8}
@media(prefers-color-scheme:dark){:root{--bg:#1f1710;--card:#2c2218;--ink:#f1e6d4;--mut:#b5a48e;--acc:#d4a84a;--line:#44372a}}
*{box-sizing:border-box}
body{margin:0;font:16px 'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:96px}
header{display:flex;align-items:center;gap:14px;padding:14px 16px 10px}.tp{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}.pill{border:0;background:var(--card);color:var(--ink);border-radius:24px;padding:12px 18px;font:inherit;font-weight:600}.ic{display:flex;gap:10px}.ic a{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;font-size:20px}.logo{width:96px;height:96px;border-radius:50%;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.28)}header small{display:block;font-size:12px;letter-spacing:.22em;color:var(--mut)}
h1{margin:2px 0;font:700 34px/1.05 'Dancing Script',cursive}
header p{margin:2px 0 0;color:var(--mut)}
#cats{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
#cats button{white-space:nowrap;border:1px solid var(--line);border-radius:10px;padding:9px 14px;background:var(--card);color:var(--ink);font:inherit}
#cats .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#grid{display:grid;gap:10px;padding:6px 16px}
.item{display:flex;gap:12px;background:var(--card);border-radius:8px;padding:10px;align-items:center;border:1px solid var(--line)}
.item img,.ph{width:88px;height:88px;border-radius:6px;object-fit:cover;flex:none;background:var(--acc);display:grid;place-items:center;font-size:36px}
.i{flex:1;min-width:0}.i b{display:block;font-size:17px}.i small{color:var(--mut);display:block;margin:2px 0 4px}
.add{border:0;background:var(--acc);color:#1c2a22;border-radius:8px;width:40px;height:40px;font-size:24px;font-weight:600}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);display:none}
.btn{width:100%;border:0;background:var(--acc);color:#1c2a22;padding:15px;border-radius:8px;font:600 17px inherit;font-family:inherit}
.ghost{background:none;color:var(--mut);margin-top:6px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end}
#sheet.show{display:flex}
#sh{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#sh h2{margin:0 0 8px}
input,textarea{width:100%;padding:13px;margin:5px 0;border-radius:8px;border:1px solid var(--line);font:inherit;background:var(--card);color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0}
.row .q button{border:1px solid var(--line);background:var(--card);color:var(--ink);width:32px;height:32px;border-radius:6px;font-size:18px}
.row .q{display:flex;align-items:center;gap:8px}
.ok{text-align:center;padding:24px 0}.ok h2{font-size:26px}
</style></head><body>

<div id="cats"></div><div id="grid"><p style="padding:16px">Menü yükleniyor…</p></div>
<div id="bar"><button class="btn" data-o>Sepeti gör</button></div>
<div id="sheet"><div id="sh"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// Firebase konsolundan aldığın ayarları buraya yapıştır (admin.html içinde de aynısı olmalı)
const CFG={apiKey:"AIzaSyBJ6ZkJ5A60wbCIQr4iQBSIZuEP_TwhhDo",authDomain:"tostcu-umit.firebaseapp.com",projectId:"tostcu-umit"};
firebase.initializeApp(CFG);const db=firebase.firestore();
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TL=n=>Number(n).toLocaleString('tr-TR')+' ₺';
let menu=[],cart={},cat='Hepsi',open=false,unT=null;
db.collection('menu').onSnapshot(s=>{
  menu=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.aktif!==false).sort((a,b)=>(a.sira||0)-(b.sira||0));
  render()},e=>{$('#grid').innerHTML='<p style="padding:16px">Menü açılamadı. Bağlantını kontrol et.</p>'});
const total=()=>Object.entries(cart).reduce((t,[id,q])=>{const m=menu.find(x=>x.id==id);return t+(m?m.fiyat*q:0)},0);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function render(){
  const cats=['Hepsi',...new Set(menu.map(m=>m.kategori||'Diğer'))];
  $('#cats').innerHTML=cats.map(c=>`<button class="${c==cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('#grid').innerHTML=menu.filter(m=>cat=='Hepsi'||(m.kategori||'Diğer')==cat).map(m=>
    `<div class="item">${m.foto?`<img src="${esc(m.foto)}" alt="" loading="lazy">`:'<div class="ph">🥪</div>'}<div class="i"><b>${esc(m.ad)}</b><small>${esc(m.aciklama)}</small><span>${TL(m.fiyat)}</span></div><button class="add" data-a="${m.id}" aria-label="Ekle">+</button></div>`).join('')||'<p style="padding:16px">Bu kategoride ürün yok.</p>';
  const n=count();$('#bar').style.display=n?'block':'none';$('#bar button').textContent=`Sepeti gör (${n}) · ${TL(total())}`;
  if(open)sheet();
}
function sheet(){
  const v=['ad','tel','adr','not'].map(i=>$('#'+i)?.value||'');
  const rows=Object.entries(cart).map(([id,q])=>{const m=menu.find(x=>x.id==id);return m?`<div class="row"><span>${esc(m.ad)}</span><span class="q"><button data-m="${id}">−</button>${q}<button data-a="${id}">+</button></span><b>${TL(m.fiyat*q)}</b></div>`:''}).join('');
  $('#sh').innerHTML=`<h2>Sepetin</h2>${rows}<div class="row"><b>Toplam</b><b>${TL(total())}</b></div>
  <input id="ad" placeholder="Adın soyadın" autocomplete="name"><input id="tel" type="tel" placeholder="Telefon numaran" autocomplete="tel">
  <textarea id="adr" rows="2" placeholder="Açık adres (mahalle, sokak, kapı no)"></textarea><input id="not" placeholder="Siparişe not (isteğe bağlı)">
  <p style="color:var(--mut);margin:6px 0">Ödeme kapıda: nakit veya kart.</p>
  <button class="btn" data-s>Siparişi ver</button><button class="btn ghost" data-x>Menüye dön</button>`;
  ['ad','tel','adr','not'].forEach((i,k)=>$('#'+i).value=v[k]);
  $('#sheet').classList.add('show');open=true;
}
function close(){$('#sheet').classList.remove('show');open=false;unT&&unT();unT=null}
async function send(){
  const o={ad:$('#ad').value.trim(),tel:$('#tel').value.trim(),adres:$('#adr').value.trim(),not:$('#not').value.trim()};
  if(!o.ad||!o.tel||!o.adres){alert('Ad, telefon ve adres gerekli.');return}
  const b=$('[data-s]');b.disabled=true;b.textContent='Gönderiliyor…';
  const items=Object.entries(cart).map(([id,q])=>{const m=menu.find(x=>x.id==id);return m&&{ad:m.ad,fiyat:m.fiyat,adet:q}}).filter(Boolean);
  try{
    const tn=norm(o.tel),r=db.collection('orders').doc(),z=firebase.firestore.FieldValue.serverTimestamp(),toplam=total(),bt=db.batch();
    bt.set(r,{...o,telN:tn,items,toplam,durum:'Yeni',odeme:'Kapıda',zaman:z});
    bt.set(db.collection('takip').doc(tn).collection('s').doc(r.id),{items,toplam,durum:'Yeni',zaman:z});await bt.commit();
    try{localStorage.setItem('tel',tn)}catch(e){}
    cart={};$('#bar').style.display='none';
    $('#sh').innerHTML=`<div class="ok"><h2>Siparişin alındı</h2><p>Sipariş no: <b>${r.id.slice(-5).toUpperCase()}</b></p><p>Hazırlanınca seni arayacağız.</p><button class="btn" data-tk>Siparişimi takip et</button><button class="btn ghost" data-x>Kapat</button></div>`;
  }catch(e){b.disabled=false;b.textContent='Siparişi ver';alert('Sipariş gönderilemedi. Tekrar dene.')}
}
const norm=t=>{t=String(t).replace(/\D/g,'');if(t.startsWith('90')&&t.length==12)t=t.slice(2);if(t.startsWith('0'))t=t.slice(1);return t};
function trackUI(){
  let sv='';try{sv=localStorage.getItem('tel')||''}catch(e){}
  $('#sh').innerHTML=`<h2>Siparişim</h2><input id="tt" type="tel" placeholder="Sipariş verdiğin telefon numarası" value="${esc(sv)}"><button class="btn" data-tg>Siparişimi göster</button><div id="tl" style="margin:10px 0"></div><button class="btn ghost" data-x>Kapat</button>`;
  $('#sheet').classList.add('show');open=false;if(sv)watch(sv);
}
function watch(t){
  const n=norm(t);unT&&unT();unT=null;
  if(n.length<10){$('#tl').innerHTML='<p>Geçerli bir telefon numarası gir.</p>';return}
  const L={Yeni:'Siparişin alındı',Hazırlanıyor:'Hazırlanıyor',Yolda:'Yolda'};
  unT=db.collection('takip').doc(n).collection('s').onSnapshot(s=>{
    $('#tl').innerHTML=s.docs.map(d=>d.data()).sort((a,b)=>(b.zaman?.seconds||0)-(a.zaman?.seconds||0)).map(o=>`<div class="item" style="display:block;margin:8px 0"><b>${esc(L[o.durum]||o.durum)}</b><div>${(o.items||[]).map(i=>i.adet+'× '+esc(i.ad)).join(', ')}</div><div>${TL(o.toplam||0)}</div></div>`).join('')||'<p>Aktif siparişin yok. Teslim edilen siparişler burada görünmez.</p>';
  },()=>{$('#tl').innerHTML='<p>Sipariş bilgisi alınamadı.</p>'});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-c],[data-a],[data-m],[data-o],[data-x],[data-s],[data-tk],[data-tg]');if(!t)return;
  const d=t.dataset;
  if('c'in d){cat=d.c;render()}
  else if('a'in d){cart[d.a]=(cart[d.a]||0)+1;render()}
  else if('m'in d){cart[d.m]--;if(cart[d.m]<=0)delete cart[d.m];if(!count())close();render()}
  else if('o'in d)sheet();
  else if('x'in d){close();render()}
  else if('tk'in d)trackUI();
  else if('tg'in d)watch($('#tt').value);
  else if('s'in d)send();
});
</script></body></html>
