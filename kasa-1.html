<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tostcu Ümit · Kasa</title>
<link rel="manifest" href="manifest-kasa.json"><meta name="theme-color" content="#1f1710"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--card:#fff;--ink:#2e2118;--mut:#7a6a5a;--acc:#c0392b;--line:#ddd2c2}
@media(prefers-color-scheme:dark){:root{--bg:#17110c;--card:#241b14;--ink:#f1e6d4;--mut:#b5a48e;--acc:#e0584a;--line:#40342a}}
*{box-sizing:border-box}
body{margin:0;font:16px 'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.w{padding:14px 16px}h1{margin:0;font-size:24px;font-weight:800}
input,button{font:inherit}input{width:100%;padding:12px;margin:4px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:999px}
.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}.on{background:var(--acc);color:#fff;border-color:var(--acc)}
nav{display:flex;gap:8px;padding:0 16px}nav button{flex:1}
.o,.m{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.o.Yeni{border:2px solid var(--acc)}.o.İptal,.o.İade{opacity:.6}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{font-weight:600}.Yeni .st{color:var(--acc)}.mut{color:var(--mut)}a{color:inherit}
.acts{display:flex;gap:8px;margin-top:8px}.acts>*{flex:1;min-width:0}
</style></head><body>
<div id="app" hidden>
<div class="w top"><h1>🧾 Kasa <span class="mut" id="me" style="font-size:16px"></span></h1><span><button id="en">🔔</button> <button id="cx">Çıkış</button></span></div>
<nav><button data-t="o" class="on">Siparişler</button><button data-t="k">Satış</button></nav>
<div class="w" id="o"></div><div class="w" id="k" hidden></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CFG={apiKey:"AIzaSyBJ6ZkJ5A60wbCIQr4iQBSIZuEP_TwhhDo",authDomain:"tostcu-umit.firebaseapp.com",projectId:"tostcu-umit"};
firebase.initializeApp(CFG);const db=firebase.firestore(),auth=firebase.auth();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TL=n=>Number(n).toLocaleString('tr-TR',{maximumFractionDigits:2})+' ₺';
const norm=t=>{t=String(t).replace(/\D/g,'');if(t.startsWith('90')&&t.length==12)t=t.slice(2);if(t.startsWith('0'))t=t.slice(1);return t};
const BOY=[['c','Çeyrek'],['y','Yarım'],['t','Tam']],NEXT={Yeni:'Hazırlanıyor',Hazırlanıyor:'Yolda',Yolda:'Teslim edildi'};
const sizes=m=>m.p?BOY.filter(([k])=>m.p[k]>0).map(([k,l])=>({l,f:+m.p[k]})):[{l:'Adet',f:+m.fiyat||0}];
let me=null,orders=[],menu=[],kc={},ik=false,view='o',first=true,ac=null,started=false;
$('#cx').onclick=()=>auth.signOut().then(()=>location.replace('giris.html'));
auth.onAuthStateChanged(u=>{
  if(!u){location.replace('giris.html');return}
  if(!u.email.endsWith('@kasa.tostcu')){location.replace('admin.html');return}
  $('#app').hidden=false;
  db.collection('kasiyer').doc(u.uid).onSnapshot(d=>{me=d.exists&&d.data().aktif!==false?d.data():null;
    if(!me){auth.signOut().then(()=>location.replace('giris.html?h=pasif'));return}
    $('#me').textContent=me.kullanici;draw()},()=>{});
  if(!started){started=true;start()}
});
function start(){
  db.collection('orders').orderBy('zaman','desc').limit(60).onSnapshot(s=>{
    if(!first&&s.docChanges().some(c=>c.type=='added'&&!c.doc.metadata.hasPendingWrites&&c.doc.data().durum=='Yeni')){announce();navigator.vibrate?.([300,150,300])}
    first=false;orders=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
  db.collection('menu').onSnapshot(s=>{menu=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.sira||0)-(b.sira||0));draw()});
  setInterval(()=>{if(orders.some(o=>o.durum=='Yeni'))announce()},15000);
}
function beep(){if(!ac)return;[0,.25].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.4;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.18)})}
function announce(){beep();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Yeni sipariş geldi');u.lang='tr-TR';speechSynthesis.speak(u)}catch(e){}}
$('#en').onclick=async()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();await ac.resume();announce();try{await navigator.wakeLock?.request('screen')}catch(e){}$('#en').textContent='🔔 Açık'};
const nm=i=>esc(i.ad)+(i.boy&&i.boy!='Adet'?' ('+i.boy+')':'')+(i.ikram?' 🎁':'');
function draw(){const y=orders.filter(o=>o.durum=='Yeni').length;document.title=(y?'('+y+') ':'')+'Tostcu Ümit · Kasa';(view=='o'?drawO:drawK)()}
function drawO(){
  $('#o').innerHTML=orders.map(o=>{
    const t=o.zaman?.toDate?.().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})||'',n=NEXT[o.durum];let h='';
    if(n)h+=`<button class="p" data-st="${o.id}|${n}">${n==='Hazırlanıyor'?'Siparişi kabul et':n==='Yolda'?'Yola çıktı':'Teslim edildi'}</button>`;
    if(n&&me?.iptal)h+=`<button data-st="${o.id}|İptal">İptal</button>`;
    if(o.durum=='Teslim edildi'&&me?.iade)h+=`<button data-st="${o.id}|İade">İade</button>`;
    return `<div class="o ${esc(o.durum)}"><div class="top"><b>#${o.id.slice(-5).toUpperCase()} · ${t}</b><span class="st">${esc(o.durum)}</span></div>
    <div>${esc(o.ad)}${o.tel?` · <a href="tel:${esc(o.tel)}">${esc(o.tel)}</a>`:''}</div><div class="mut">${esc(o.adres)}</div>
    <div style="margin-top:6px">${(o.items||[]).map(i=>`${i.adet}× ${nm(i)}`).join('<br>')}</div>${o.not?`<div class="mut">Not: ${esc(o.not)}</div>`:''}
    <div class="top" style="margin-top:6px"><b>${TL(o.toplam||0)}</b><span class="mut">${o.kaynak=='Dükkan'?'Şube':'QR'} · ${esc(o.odeme)}</span></div>${h?`<div class="acts">${h}</div>`:''}</div>`}).join('')||'<p class="mut">Henüz sipariş yok.</p>';
}
function lines(){return Object.entries(kc).map(([k,q])=>{const[id,l,i]=k.split('|'),m=menu.find(x=>x.id==id),s=m&&sizes(m).find(z=>z.l==l);return s&&{k,m,l,f:s.f,q,ik:i=='1'}}).filter(Boolean)}
function drawK(){
  const L=lines(),t=L.reduce((a,x)=>a+(x.ik?0:x.f*x.q),0);
  $('#k').innerHTML=(me?.ikram?`<button class="${ik?'p':''}" data-ik style="width:100%">🎁 İkram: ${ik?'AÇIK, eklenenler ücretsiz':'kapalı'}</button>`:'')+
  menu.filter(m=>m.aktif!==false).map(m=>`<div class="m"><b>${esc(m.ad)}</b><div class="acts">${sizes(m).map(s=>`<button data-ka="${m.id}|${s.l}">${s.l}<br>${TL(s.f)}</button>`).join('')}</div></div>`).join('')+
  `<div class="m"><b>Sepet</b>${L.map(x=>`<div class="top" style="margin:6px 0"><span>${x.q}× ${esc(x.m.ad)} (${x.l})${x.ik?' 🎁':''}</span><span>${TL(x.ik?0:x.f*x.q)} <button data-kd="${x.k}">−</button></span></div>`).join('')||'<span class="mut">Boş</span>'}
  <div class="top" style="margin-top:8px"><b>Toplam</b><b style="font-size:26px">${TL(t)}</b></div>
  <div class="acts"><button class="p" data-ks="Nakit"${L.length?'':' disabled'}>Nakit</button><button class="p" data-ks="Kart"${L.length?'':' disabled'}>Kart</button><button data-kx>Temizle</button></div></div>`;
}
document.addEventListener('click',e=>go(e).catch(x=>alert('İşlem yapılamadı: '+(x.code=='permission-denied'?'yetkin yok.':x.message))));
async function go(e){
  const t=e.target.closest('[data-t],[data-st],[data-ka],[data-kd],[data-kx],[data-ks],[data-ik]');if(!t)return;const d=t.dataset;
  if('t'in d){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===t));view=d.t;$('#o').hidden=view!='o';$('#k').hidden=view!='k';draw()}
  else if('st'in d){const[id,st]=d.st.split('|');
    if((st=='İptal'||st=='İade')&&!confirm('Sipariş '+st.toLowerCase()+' edilsin mi?'))return;
    const o=orders.find(x=>x.id==id),n=o&&(o.telN||norm(o.tel||'')),tr=n&&db.collection('takip').doc(n).collection('s').doc(id),b=db.batch();
    b.update(db.collection('orders').doc(id),{durum:st,isleyen:me.kullanici});
    if(tr){if(st=='Teslim edildi'||st=='İptal'||st=='İade')b.delete(tr);else b.set(tr,{durum:st},{merge:true})}
    await b.commit()}
  else if('ik'in d){if(!me?.ikram)return;ik=!ik;drawK()}
  else if('ka'in d){const k=d.ka+'|'+(ik&&me?.ikram?1:0);kc[k]=(kc[k]||0)+1;drawK()}
  else if('kd'in d){kc[d.kd]--;if(kc[d.kd]<=0)delete kc[d.kd];drawK()}
  else if('kx'in d){kc={};drawK()}
  else if('ks'in d){const L=lines();if(!L.length)return;
    const items=L.map(x=>({id:x.m.id,ad:x.m.ad,boy:x.l,fiyat:x.ik?0:x.f,adet:x.q,ikram:x.ik,deger:x.f})),toplam=items.reduce((a,i)=>a+i.fiyat*i.adet,0);
    await db.collection('orders').add({ad:'Dükkan satışı',tel:'',adres:'',items,toplam,durum:'Teslim edildi',odeme:toplam?d.ks:'İkram',kaynak:'Dükkan',isleyen:me.kullanici,zaman:firebase.firestore.FieldValue.serverTimestamp()});kc={};drawK()}
}
</script></body></html>
